version: 1

backend:
  phases:
    preBuild:
      commands:
        # Force Node.js 20
        - nvm install 20
        - nvm use 20
        - node --version
        - npm --version

        # Install dependencies
        - npm install --cache .npm --prefer-offline

    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        # Force Node.js 20
        - nvm install 20
        - nvm use 20
        - node --version
        - npm --version

        # Install dependencies
        - npm install --cache .npm --prefer-offline

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*