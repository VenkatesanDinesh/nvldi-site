version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm -v
        - rm -rf node_modules
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        - chmod +x node_modules/.bin/vite
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - .npm/**/*